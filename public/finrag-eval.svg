<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08081a"/>
      <stop offset="1" stop-color="#050510"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="600" fill="url(#bg)"/>
  <rect width="1200" height="600" fill="none"/>

  <!-- title -->
  <text x="64" y="86" fill="#f4f4f5" font-size="40" font-weight="700">finrag-eval</text>
  <text x="64" y="122" fill="#60a5fa" font-size="20" font-weight="600" letter-spacing="1">RAG EVALUATION · APPLE FY2024 10-K</text>

  <!-- pipeline -->
  <g font-size="17" font-weight="600">
    <rect x="64" y="176" width="150" height="64" rx="12" fill="#0b1220" stroke="#3f3f46"/>
    <text x="139" y="205" fill="#a1a1aa" text-anchor="middle">SEC EDGAR</text>
    <text x="139" y="226" fill="#71717a" text-anchor="middle" font-size="13">10-K PDF</text>

    <rect x="248" y="176" width="164" height="64" rx="12" fill="#0b1220" stroke="#3f3f46"/>
    <text x="330" y="205" fill="#a1a1aa" text-anchor="middle">Section-aware</text>
    <text x="330" y="226" fill="#71717a" text-anchor="middle" font-size="13">chunking</text>

    <rect x="446" y="176" width="164" height="64" rx="12" fill="#0b1220" stroke="#3f3f46"/>
    <text x="528" y="205" fill="#a1a1aa" text-anchor="middle">pgvector</text>
    <text x="528" y="226" fill="#71717a" text-anchor="middle" font-size="13">local retrieval</text>

    <rect x="644" y="176" width="164" height="64" rx="12" fill="#0b1220" stroke="#3f3f46"/>
    <text x="726" y="205" fill="#a1a1aa" text-anchor="middle">llama3</text>
    <text x="726" y="226" fill="#71717a" text-anchor="middle" font-size="13">$0 API cost</text>

    <rect x="842" y="176" width="180" height="64" rx="12" fill="#0b1a16" stroke="#10b981"/>
    <text x="932" y="205" fill="#6ee7b7" text-anchor="middle">DeepEval</text>
    <text x="932" y="226" fill="#34d399" text-anchor="middle" font-size="13">+ ground truth</text>
  </g>
  <g stroke="#3f3f46" stroke-width="2" fill="none">
    <path d="M214 208 h30"/><path d="M412 208 h30"/><path d="M610 208 h30"/><path d="M808 208 h30"/>
  </g>

  <!-- findings -->
  <g>
    <rect x="64" y="300" width="464" height="220" rx="16" fill="#0a1512" stroke="#10b981" stroke-opacity="0.5"/>
    <text x="92" y="344" fill="#6ee7b7" font-size="20" font-weight="700">2 / 3 honest refusals</text>
    <text x="92" y="378" fill="#a1a1aa" font-size="16">System correctly said "not found in context"</text>
    <text x="92" y="402" fill="#a1a1aa" font-size="16">instead of inventing figures.</text>
    <line x1="92" y1="426" x2="500" y2="426" stroke="#27272a"/>
    <text x="92" y="462" fill="#f4f4f5" font-size="16" font-weight="600">The dangerous case:</text>
    <text x="92" y="490" fill="#a1a1aa" font-size="16">1 confident hallucination with precise</text>
    <text x="92" y="512" fill="#a1a1aa" font-size="16">but wrong numbers — caught by the eval.</text>
  </g>

  <g>
    <rect x="560" y="300" width="576" height="220" rx="16" fill="#0b1220" stroke="#3f3f46"/>
    <text x="588" y="344" fill="#60a5fa" font-size="20" font-weight="700">The eval found a bug in the eval framework</text>
    <text x="588" y="380" fill="#a1a1aa" font-size="16">ContextualPrecisionMetric penalized overlapping</text>
    <text x="588" y="402" fill="#a1a1aa" font-size="16">chunks as retrieval failures — scores got worse</text>
    <text x="588" y="424" fill="#a1a1aa" font-size="16">as chunk quality improved.</text>
    <line x1="588" y1="448" x2="1108" y2="448" stroke="#27272a"/>
    <text x="588" y="486" fill="#f4f4f5" font-size="16">Filed Issue #2594 → contributed merged fix</text>
    <text x="588" y="510" fill="#6ee7b7" font-size="16" font-weight="700">DeepEval PR #2743 · merged</text>
  </g>
</svg>
